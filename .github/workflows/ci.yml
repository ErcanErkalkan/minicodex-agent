name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy type check
        run: mypy src/minicodex_agent
      - name: Fast marker-aware test matrix
        run: python scripts/run_test_matrix.py --group fast --json
      - name: Integration marker-aware test matrix
        run: python scripts/run_test_matrix.py --group integration --json
      - name: Subprocess marker-aware test matrix
        run: python scripts/run_test_matrix.py --group subprocess --json
      - name: File-level coverage gate after matrix
        run: python scripts/run_coverage_gate.py --group all --fail-under 85 --json
      - name: Build package
        run: python -m build
      - name: Twine package check
        run: twine check dist/*
      - name: Package import smoke test
        run: python -c "import minicodex_agent; print(minicodex_agent.__version__)"
      - name: CLI smoke test
        run: minicodex "smoke test" --provider stub --root . --max-steps 1 --no-diff --no-log --non-interactive
