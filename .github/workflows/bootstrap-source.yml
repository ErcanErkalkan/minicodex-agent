name: Publish staged MiniCodex source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-ddac-8210-8f3d-75378038bb7b/raw?se=2026-09-15T06%3A20%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=f3607055-391c-53cc-b4b8-662944042bf2&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A03%3A01Z&ske=2026-09-15T20%3A03%3A01Z&sks=b&skv=2026-02-06&sig=CpzfzvJ00cf8g%2BBGoc6WWuVm0ntNk7bwg%2BJqnc/05CQ%3D' -o /tmp/minicodex-source.tar.xz
          echo "b87be2dcbf25ff939b33143e9dd4f1d0d88aee19d81f7d51859f58487f3b9b3e  /tmp/minicodex-source.tar.xz" | sha256sum -c -
          xz -t /tmp/minicodex-source.tar.xz

      - name: Extract source tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/minicodex-source.tar.xz -C .

      - name: Verify Python syntax and registry integrity
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m compileall -q src scripts
          python - <<'PY'
          import minicodex_agent
          from minicodex_agent.action_schema import ACTION_SPECS
          from minicodex_agent.tool_registry import get_tool_registry

          assert minicodex_agent.__version__ == "4.4.23"
          registry = get_tool_registry()
          assert set(ACTION_SPECS) == set(registry)
          print(f"MiniCodex verification OK: version={minicodex_agent.__version__}, actions={len(ACTION_SPECS)}")
          PY

      - name: Commit published source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md PROJECT_DOCUMENTATION.md LICENSE pyproject.toml .env.example .pre-commit-config.yaml docs scripts src
          if git diff --cached --quiet; then
            echo "Source tree already published; no commit required."
            exit 0
          fi
          git commit -m "feat: publish MiniCodex Agent v4.4.23 source"
          git push origin HEAD:main
